[project]
name = "studentassistant"
description = "Turns handwritten class notes into faithful digital study notes (Ubuntu PC backend)."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.8.0",
    "fastapi>=0.141.1",
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "segno>=1.6.6",
    "tomlkit>=0.15.1",
    "typer>=0.27.2",
    "uvicorn>=0.53.0",
    "websockets>=17.1",
]
dynamic = ["version"]

[project.scripts]
studentassistant = "studentassistant.cli:cli"

# Server-side speech-to-text providers (ADR-0008): name = "module:SpeechToTextProvider subclass".
# A new provider is one module + one line here + `stt.provider = "<name>"` in the config.
[project.entry-points."studentassistant.stt_providers"]
fake = "studentassistant.stt.fakes:FakeProvider"

[project.optional-dependencies]
whisper = [
    "faster-whisper>=1.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/studentassistant/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/studentassistant"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["studentassistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a GPU, the network or a real Claude call; scripts/test.sh never runs it",
]
