[project]
name = "studentassistant"
description = "Turns handwritten class notes into faithful digital study notes (Ubuntu PC backend)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
    "uvicorn>=0.53.0",
]
dynamic = ["version"]

[project.scripts]
studentassistant = "studentassistant.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/studentassistant/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/studentassistant"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["studentassistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a GPU, the network or a real Claude call; scripts/test.sh never runs it",
]
