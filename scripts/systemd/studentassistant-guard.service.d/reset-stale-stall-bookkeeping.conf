# Workaround titanarq/agent-os#52: the guard's Qwen stall bookkeeping carries over between runs.
# Re-anchors .cache/agent_guard_<backend>.json when the live run (issue + startref) changed.
# The leading "-" means a failure here never stops the tick itself.
# Copy to ~/.config/systemd/user/studentassistant-guard.service.d/ and daemon-reload.
[Service]
ExecStartPre=-/home/titan/projects/studentassistant/agent_os/.venv/bin/python /home/titan/projects/studentassistant/scripts/reset_stale_stall_bookkeeping.py
