# Single source of truth for every version in the android build (AGENTS.md "Kotlin / Android
# conventions"). No version literal may appear in any build.gradle.kts; the one exception is the
# foojay resolver plugin in settings.gradle.kts, because Gradle evaluates pluginManagement before
# this file loads.

[versions]
agp = "8.6.1"
kotlin = "2.1.21"
foojayResolver = "0.8.0" # applied from settings.gradle.kts, which cannot read this catalog
activityCompose = "1.10.1"
composeBom = "2025.08.00"
junit = "4.13.2"
kotlinxSerialization = "1.8.1"
kotlinxCoroutines = "1.10.2"
lifecycle = "2.9.2"
okhttp = "4.12.0"
datastore = "1.1.7"
camerax = "1.4.2"
zxing = "3.5.3"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

# Backend client (backend/): HTTP to the paired backend
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

# Paired backends store (backend/BackendStore.kt): a JSON file in app-private storage
androidx-datastore-core = { group = "androidx.datastore", name = "datastore-core", version.ref = "datastore" }

# Pairing QR scanner (pairing/): camera preview + frame analysis, decoded by ZXing (no Play Services)
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }

# Wire contract (protocol/): JSON codec for the @Serializable protocol classes
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# Tests: JVM only (src/test), fakes over mocks (AGENTS.md)
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
